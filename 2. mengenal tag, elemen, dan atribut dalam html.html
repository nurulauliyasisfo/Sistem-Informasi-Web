<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tag, Elemen, dan Atribut</title>
</head>
<body>
  <!-- Tag pembuka <p> dan tag penutup </p> membentuk satu elemen -->
  <p>Ini adalah elemen paragraf.</p>

  <!-- Atribut ditulis di dalam tag pembuka: nama="nilai" -->
  <p id="intro" class="catatan" title="Teks bantuan">Paragraf ini punya tiga atribut.</p>

  <!-- Elemen tanpa tag penutup disebut elemen kosong (void element) -->
  <hr>
  <br>

  <!-- Elemen bisa bersarang (nested) -->
  <div>
    <p>Paragraf di dalam <strong>div</strong>.</p>
  </div>
</body>
</html>
